<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>테트리스</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a1a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Courier New', monospace;
    color: #fff;
    overflow: hidden;
  }
  .stars {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }
  .star {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    animation: twinkle 3s infinite;
  }
  @keyframes twinkle {
    0%,100%{opacity:0.2;} 50%{opacity:1;}
  }
  .game-wrapper {
    position: relative;
    z-index: 1;
    display: flex;
    gap: 20px;
    align-items: flex-start;
  }
  .side-panel {
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: 150px;
  }
  .panel-box {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px;
    padding: 14px;
  }
  .panel-box h3 {
    font-size: 11px;
    letter-spacing: 2px;
    color: #aaa;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .panel-box .value {
    font-size: 24px;
    font-weight: bold;
    color: #fff;
    text-shadow: 0 0 10px rgba(100,200,255,0.8);
  }
  #nextCanvas {
    display: block;
    margin: 0 auto;
  }
  .main-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .game-title {
    font-size: 28px;
    font-weight: bold;
    letter-spacing: 6px;
    background: linear-gradient(90deg, #ff4e50, #fc913a, #f9d62e, #7bc67e, #4ca1af, #c779d0);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: none;
  }
  #gameCanvas {
    border: 2px solid rgba(255,255,255,0.2);
    border-radius: 4px;
    box-shadow: 0 0 30px rgba(100,200,255,0.3), 0 0 60px rgba(100,100,255,0.15);
    display: block;
  }
  .controls {
    display: flex;
    gap: 10px;
  }
  button {
    padding: 10px 22px;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 8px;
    background: rgba(255,255,255,0.08);
    color: #fff;
    font-family: 'Courier New', monospace;
    font-size: 13px;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s;
  }
  button:hover {
    background: rgba(255,255,255,0.18);
    box-shadow: 0 0 12px rgba(100,200,255,0.4);
  }
  .key-hints {
    font-size: 10px;
    color: #555;
    text-align: center;
    letter-spacing: 1px;
    line-height: 1.8;
  }
  .score-list {
    max-height: 180px;
    overflow-y: auto;
  }
  .score-list::-webkit-scrollbar { width: 3px; }
  .score-list::-webkit-scrollbar-track { background: transparent; }
  .score-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
  .score-item {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    padding: 4px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    color: #ccc;
  }
  .score-item:first-child { color: #ffd700; }
  .score-item:nth-child(2) { color: #c0c0c0; }
  .score-item:nth-child(3) { color: #cd7f32; }
  .overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.82);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 16px;
    border-radius: 4px;
    z-index: 10;
  }
  .overlay h2 {
    font-size: 26px;
    letter-spacing: 4px;
    color: #fff;
    text-shadow: 0 0 20px rgba(255,100,100,0.8);
  }
  .overlay p {
    font-size: 13px;
    color: #aaa;
    letter-spacing: 1px;
  }
  .overlay .final-score {
    font-size: 36px;
    color: #ffd700;
    text-shadow: 0 0 15px rgba(255,215,0,0.6);
  }
  .mobile-controls {
    display: none;
    gap: 8px;
    flex-direction: column;
    align-items: center;
    margin-top: 6px;
  }
  .mobile-row { display: flex; gap: 8px; }
  .m-btn {
    width: 52px; height: 52px;
    font-size: 20px;
    padding: 0;
    display: flex; align-items: center; justify-content: center;
    border-radius: 10px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.25);
    user-select: none;
    -webkit-user-select: none;
  }
  @media(max-width:700px){
    .mobile-controls { display: flex; }
    .key-hints { display: none; }
    .game-wrapper { flex-direction: column; align-items: center; gap: 10px; }
    .side-panel { flex-direction: row; width: auto; flex-wrap: wrap; justify-content: center; }
    .side-panel .panel-box { flex: 1; min-width: 100px; }
  }
</style>
</head>
<body>
<div class="stars" id="stars"></div>

<div class="game-wrapper">
  <!-- Left Panel -->
  <div class="side-panel">
    <div class="panel-box">
      <h3>Score</h3>
      <div class="value" id="scoreDisplay">0</div>
    </div>
    <div class="panel-box">
      <h3>Level</h3>
      <div class="value" id="levelDisplay">1</div>
    </div>
    <div class="panel-box">
      <h3>Lines</h3>
      <div class="value" id="linesDisplay">0</div>
    </div>
    <div class="panel-box">
      <h3>Next</h3>
      <canvas id="nextCanvas" width="100" height="100"></canvas>
    </div>
  </div>

  <!-- Main Game -->
  <div class="main-area">
    <div class="game-title">TETRIS</div>
    <div style="position:relative;">
      <canvas id="gameCanvas" width="300" height="600"></canvas>
      <div class="overlay" id="overlay">
        <h2>🎮 TETRIS</h2>
        <p>네모 블록을 쌓아 줄을 완성하세요!</p>
        <button onclick="startGame()">게임 시작</button>
      </div>
    </div>
    <div class="controls">
      <button onclick="startGame()">새 게임</button>
      <button onclick="togglePause()">일시정지</button>
    </div>
    <div class="mobile-controls">
      <div class="mobile-row">
        <button class="m-btn" ontouchstart="mobileBtn('rotate')">🔄</button>
      </div>
      <div class="mobile-row">
        <button class="m-btn" ontouchstart="mobileBtn('left')">◀</button>
        <button class="m-btn" ontouchstart="mobileBtn('down')">▼</button>
        <button class="m-btn" ontouchstart="mobileBtn('right')">▶</button>
      </div>
      <div class="mobile-row">
        <button class="m-btn" ontouchstart="mobileBtn('drop')" style="width:112px;">⬇⬇ Drop</button>
      </div>
    </div>
    <div class="key-hints">
      ← → 이동 &nbsp;|&nbsp; ↑ 회전 &nbsp;|&nbsp; ↓ 빠르게<br>
      SPACE 즉시 낙하 &nbsp;|&nbsp; P 일시정지
    </div>
  </div>

  <!-- Right Panel -->
  <div class="side-panel">
    <div class="panel-box">
      <h3>🏆 High Scores</h3>
      <div class="score-list" id="scoreList">
        <div style="font-size:11px;color:#555;">로딩 중...</div>
      </div>
    </div>
  </div>
</div>

function createBoard() {
  return Array.from({length:ROWS}, ()=>Array(COLS).fill(0));
}

function randomPiece() {
  const id = Math.floor(Math.random()*7)+1;
  const matrix = PIECES[id].map(r=>[...r]);
  return {
    matrix,
    id,
    x: Math.floor(COLS/2) - Math.floor(matrix[0].length/2),
    y: 0
  };
}

function drawBlock(context, x, y, colorId, blockSize, alpha=1) {
  const color = COLORS[colorId];
  context.globalAlpha = alpha;
  // Main fill
  context.fillStyle = color;
  context.fillRect(x*blockSize+1, y*blockSize+1, blockSize-2, blockSize-2);
  // Highlight
  context.fillStyle = 'rgba(255,255,255,0.35)';
  context.fillRect(x*blockSize+2, y*blockSize+2, blockSize-4, 4);
  context.fillRect(x*blockSize+2, y*blockSize+2, 4, blockSize-4);
  // Shadow
  context.fillStyle = 'rgba(0,0,0,0.3)';
  context.fillRect(x*blockSize+1, y*blockSize+blockSize-5, blockSize-2, 4);
  context.globalAlpha = 1;
}
